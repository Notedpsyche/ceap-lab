[project]
name = "ceap-lab"
version = "0.1.0"
description = "Counterfactual Error-Aware Purification research workbench"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy>=2.2,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
validation = ["qiskit>=2,<3", "qiskit-aer>=0.17,<1", "pytest>=8,<10", "httpx>=0.28,<1", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
